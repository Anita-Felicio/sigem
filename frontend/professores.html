<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professores - SIGEM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>SIGEM</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="alunos.html">Alunos</a>
      <a href="professores.html" class="ativo">Professores</a>
    </nav>
  </header>

  <main>
    <h2>Professores</h2>

    <section class="cartao">
      <h3 id="titulo-formulario">Cadastrar professor</h3>
      <form id="formulario-professor">
        <input type="hidden" id="professor-id">

        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" maxlength="150" minlength="2" required>
        </div>

        <div class="campo">
          <label for="telefone">Telefone de contato</label>
          <input type="tel" id="telefone" maxlength="30" placeholder="(14) 99999-9999" required>
        </div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" maxlength="150" required>
        </div>

        <div class="campo" id="campo-senha">
          <label for="senha">Senha inicial</label>
          <div class="campo-com-botao">
            <input type="password" id="senha" minlength="8" required>
            <button type="button" id="botao-ver-senha" class="secundario">Mostrar</button>
          </div>
          <small id="forca-senha" class="ajuda">Minimo de 8 caracteres.</small>
        </div>

        <div class="campo" id="campo-confirmacao-senha">
          <label for="confirmacao-senha">Confirme a senha</label>
          <input type="password" id="confirmacao-senha" minlength="8" required>
          <small id="mensagem-senha" class="ajuda"></small>
        </div>

        <div class="campo">
          <label for="data-nascimento">Data de nascimento</label>
          <input type="date" id="data-nascimento">
        </div>

        <div class="campo">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required>
        </div>

        <div class="campo">
          <label for="especialidades">Especialidades</label>
          <textarea id="especialidades" maxlength="500" rows="3" placeholder="Ex.: violino, rock, teoria musical" required></textarea>
          <small class="ajuda">Separe as especialidades por virgulas.</small>
        </div>

        <button type="submit" id="botao-salvar">Salvar</button>
        <button type="button" id="botao-cancelar" class="secundario" hidden>Cancelar</button>
      </form>
      <p id="mensagem" class="mensagem"></p>
    </section>

    <div class="tabela-wrapper">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Telefone</th>
            <th>E-mail</th>
            <th>Nascimento</th>
            <th>CPF</th>
            <th>Especialidades</th>
            <th>Acoes</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
    </div>
  </main>

  <script src="js/professores.js"></script>
</body>
</html>
